# Realtime profile variables configuration
# Based on CPU allocation from delta-oru setup

# Isolated cores for realtime applications
# These cores will be isolated from the kernel scheduler
isolated_cores=1,2,3,4,5,6,8,9,10,11

# Kernel threads will be restricted to these cores
# CPU 0,7,12,13,14,15 are reserved for kernel and system tasks
kthread_cpus=0,7,12,13,14,15

# No-hz full cores (same as isolated cores)
nohz_full=1,2,3,4,5,6,8,9,10,11

# RCU callback cores (same as isolated cores)
rcu_nocbs=1,2,3,4,5,6,8,9,10,11

# CPU allocation breakdown:
# XRAN DPDK usage: 1,2,3
# OAI ru_thread: 4
# OAI L1_rx_thread: 5
# OAI L1_tx_thread: 6
# OAI nr-softmodem: 8,9,10,11
# Kernel: 0,7,12,13,14,15