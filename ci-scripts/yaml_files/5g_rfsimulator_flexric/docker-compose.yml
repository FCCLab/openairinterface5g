    oai-nr-ue:
        image: oai-ue-e2-kpmv301-e2apv2:0.0.1
        privileged: true
        container_name: rfsim5g-oai-nr-ue
        environment:
            USE_ADDITIONAL_OPTIONS: -E --rfsim -r 106 --numerology 1 -C 3619200000 --uicc0.imsi 208990100001100 --rfsimulator.[0].serveraddr 192.168.71.151 --log_config.global_log_options level,nocolor,time
        
        # Explicitly wait for the gNB healthcheck to pass
        depends_on:
            oai-gnb:
                condition: service_healthy
                
        networks:
            public_net:
                ipv4_address: 192.168.71.152
        volumes:
            - ../../conf_files/nrue.uicc.conf:/opt/oai-nr-ue/etc/nr-ue.conf
        healthcheck:
            test: /bin/bash -c "pgrep nr-uesoftmodem"
            interval: 10s
            timeout: 5s
            retries: 5

networks:
    public_net:
        driver: bridge
        name: rfsim5g-oai-public-net
        ipam:
            config:
                - subnet: 192.168.71.128/26
        driver_opts:
            com.docker.network.bridge.name: "rfsim5g-public"
    traffic_net:
        driver: bridge
        name: rfsim5g-oai-traffic-net
        ipam:
            config:
                - subnet: 192.168.72.128/26
        driver_opts:
            com.docker.network.bridge.name: "rfsim5g-traffic"
