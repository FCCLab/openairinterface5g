    oai-gnb:
        image: oai-gnb-e2-kpmv301-e2apv2:0.0.1
        container_name: rfsim5g-oai-gnb
        environment:
            USE_ADDITIONAL_OPTIONS: -E --rfsim --log_config.global_log_options level,nocolor,time
            ASAN_OPTIONS: detect_leaks=0:handle_segv=0:allow_user_segv_handler=1
        networks:
            public_net:
                ipv4_address: 192.168.71.151
        volumes:
            - ../../conf_files/gnb.sa.band78.106prb.rfsim.flexric.conf:/opt/oai-gnb/etc/gnb.conf
        
        # Keep the exact healthcheck! It only reports "healthy" AFTER you start GDB
        healthcheck:
            test: /bin/bash -c "pgrep nr-softmodem"
            interval: 5s
            timeout: 5s
            retries: 20

